<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paultendo sprites</title>
<style>
@font-face{font-family:VT323;src:url('/vendor/gentown/fonts/VT323-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#10130f;color:#e4dfc8;font:24px/1.2 VT323,monospace}main{max-width:1040px;margin:auto;padding:24px}h1,h2{color:#e8df93;font-weight:normal}h1{margin:0 0 16px}h2{margin:32px 0 12px}p{max-width:65ch;margin:12px 0}fieldset{border:1px solid #625e4c;padding:12px;display:flex;gap:12px;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}select{font:inherit;color:inherit;background:#24271e;border:1px solid #817b62;padding:8px;min-height:44px}select:focus-visible{outline:2px solid #e8df93;outline-offset:3px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:12px}.sample{margin:0;padding:12px;background:#1a1e16;display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0}.sprite{image-rendering:pixelated;object-fit:contain;width:96px;height:96px}.actual{width:32px;height:32px}figcaption{text-align:center;font-size:22px;overflow-wrap:anywhere}.light .sample{background:#e8e2cc;color:#383125}.condition{font-size:18px;color:#bcb79e}.light .condition{color:#544d3e}@media(max-width:430px){main{padding:16px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.sprite{width:64px;height:64px}.actual{width:32px;height:32px}}
</style></head><body><main>
<h1>Paultendo sprites</h1><p>32×32 artwork. Each sample includes an enlarged view and its actual size.</p>
<fieldset><legend>Compare appearances</legend><label>Material <select id="material"><option value="">Original</option></select></label><label>Decoration <select id="accent"><option value="">Original</option></select></label><label>Background <select id="background"><option value="dark">Dark</option><option value="light">Light</option></select></label></fieldset>
<h2>Materials, tools and vessels</h2><div class="gallery" id="inventory"></div>
<h2>Objects and their condition</h2><p>Condition marks are clipped to the object. Outlines, dial markings and reflections remain intact.</p><div class="gallery" id="objects"></div>
</main><script src="/app/sprites/data.js"></script><script src="/app/sprites/renderer.js"></script><script>
const renderer=createPaultendoSpriteRenderer(PAULTENDO_SPRITE_DATA);
const names={'clear-lens':'Clear lens','tuning-fork':'Tuning fork','timber-bins':'Wooden grain bin','glass-vessels':'Glass vessel',pottery:'Clay vessel'};
const label=id=>names[id]||id.split('-').map(s=>s[0].toUpperCase()+s.slice(1)).join(' ');
for(const [field,values] of [['material',renderer.materials],['accent',renderer.accents]])for(const name of values){const option=document.createElement('option');option.value=name;option.textContent=name[0].toUpperCase()+name.slice(1);document.getElementById(field).appendChild(option)}
function sample(id,options,condition){const figure=document.createElement('figure');figure.className='sample';for(const size of ['large','actual']){const img=document.createElement('img');img.className='sprite '+(size==='actual'?'actual':'');img.src=renderer.render(id,options);img.width=32;img.height=32;img.alt='';img.dataset.sprite=id;figure.appendChild(img)}const caption=document.createElement('figcaption');caption.textContent=label(id);figure.appendChild(caption);if(condition){const text=document.createElement('span');text.className='condition';text.textContent=condition;figure.appendChild(text)}return figure}
function draw(){const options={material:document.getElementById('material').value,accent:document.getElementById('accent').value};document.body.classList.toggle('light',document.getElementById('background').value==='light');const inventory=document.getElementById('inventory'),objects=document.getElementById('objects');inventory.replaceChildren();objects.replaceChildren();for(const id of renderer.ids.filter(id=>!['compass','clear-lens','tuning-fork'].includes(id)))inventory.appendChild(sample(id,{},''));for(const id of ['compass','clear-lens','tuning-fork'])for(const [condition,overlays] of [['Intact',[]],['Worn',['worn']],['Cracked',['cracked']],['Repaired',['cracked','repaired']]])objects.appendChild(sample(id,{...options,overlays},condition))}
for(const select of document.querySelectorAll('select'))select.addEventListener('change',draw);draw();
</script></body></html>
